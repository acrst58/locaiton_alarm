<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>지도 테스트</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
  #log { padding: 12px; font-size: 13px; line-height: 1.8; background: #1a1a2e; min-height: 80px; }
  #log .ok  { color: #10B981; }
  #log .err { color: #EF4444; }
  #log .info{ color: #818CF8; }
  #map { width: 100%; height: calc(100vh - 120px); }
</style>
</head>
<body>

<div id="log"><span class="info">▶ 페이지 로드됨. SDK 불러오는 중...</span><br/></div>
<div id="map"></div>

<script>
function log(msg, type) {
  var el = document.getElementById('log');
  var span = document.createElement('span');
  span.className = type || 'info';
  span.textContent = msg;
  el.appendChild(span);
  el.appendChild(document.createElement('br'));
}

// SDK 로드
var script = document.createElement('script');
script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=966251451b0118a705aa6981618f9cb5&libraries=services&autoload=false';

script.onload = function() {
  log('✅ SDK 스크립트 로드 성공. 지도 초기화 중...', 'ok');
  kakao.maps.load(function() {
    log('✅ kakao.maps.load() 완료. 지도 생성 시작...', 'ok');
    try {
      var container = document.getElementById('map');
      log('지도 컨테이너 크기: ' + container.offsetWidth + ' x ' + container.offsetHeight, 'info');
      var options = {
        center: new kakao.maps.LatLng(37.5665, 126.9780),
        level: 5
      };
      var map = new kakao.maps.Map(container, options);
      log('✅ 지도 생성 완료!', 'ok');
    } catch(e) {
      log('❌ 지도 생성 오류: ' + e.message, 'err');
    }
  });
};

script.onerror = function(e) {
  log('❌ SDK 로드 실패 - API 키 오류 또는 도메인 미등록', 'err');
  log('현재 도메인: ' + window.location.origin, 'err');
};

document.head.appendChild(script);
</script>
</body>
</html>
