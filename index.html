<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>위치 알람</title>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=966251451b0118a705aa6981618f9cb5&libraries=services"></script>
<style>
  :root {
    --primary: #4F46E5; --primary-light: #818CF8; --danger: #EF4444;
    --success: #10B981; --bg: #0F0F1A; --card: #1A1A2E; --card2: #16213E;
    --border: #2A2A4A; --text: #E2E8F0; --muted: #94A3B8; --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Apple SD Gothic Neo', sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  header .logo { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  header h1 { font-size: 18px; font-weight: 700; }
  header .status-dot { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: background .3s; }
  header .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
  #mapWrap { margin: 16px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); position: relative; }
  #map { width: 100%; height: 300px; }
  .map-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #fff; pointer-events: none; white-space: nowrap; }
  .section { margin: 0 16px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; font-weight: 600; }
  #destDisplay { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card2); border-radius: 12px; border: 1px solid var(--border); }
  #destDisplay .pin { font-size: 22px; }
  #destDisplay .info { flex: 1; min-width: 0; }
  #destDisplay .addr { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #destDisplay .coords { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #clearDest { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .setting-item { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .setting-item label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .setting-item select { width: 100%; background: var(--card2); border: none; color: var(--text); font-size: 13px; outline: none; cursor: pointer; }
  .setting-item select option { background: #1a1a2e; }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-val { font-size: 18px; font-weight: 700; color: var(--primary-light); min-width: 60px; text-align: right; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); cursor: pointer; }
  #testBtn { width: 100%; background: var(--card2); border: 1px dashed var(--border); border-radius: 12px; padding: 10px; color: var(--muted); font-size: 13px; cursor: pointer; margin-top: 12px; }
  #alarmToggle { width: 100%; padding: 18px; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all .3s; }
  #alarmToggle.off { background: linear-gradient(135deg, var(--primary), #7C3AED); color: #fff; }
  #alarmToggle.on { background: linear-gradient(135deg, var(--danger), #DC2626); color: #fff; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)} 50%{box-shadow:0 0 0 12px rgba(239,68,68,0)} }
  #distanceCard { display: none; }
  #distanceCard.visible { display: block; }
  .dist-display { text-align: center; padding: 16px; }
  .dist-num { font-size: 48px; font-weight: 800; color: var(--primary-light); line-height: 1; }
  .dist-unit { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .dist-bar-wrap { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .dist-bar { height: 100%; background: linear-gradient(90deg, var(--success), var(--primary)); border-radius: 4px; transition: width .5s ease; }
  #alarmOverlay { display: none; position: fixed; inset: 0; background: rgba(239,68,68,.15); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
  #alarmOverlay.show { display: flex; }
  #alarmOverlay .bell { font-size: 80px; animation: shake .3s infinite; }
  @keyframes shake { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(10deg)} }
  #alarmOverlay h2 { font-size: 24px; color: #fff; font-weight: 800; }
  #alarmOverlay p { color: #fca5a5; font-size: 14px; }
  #dismissBtn { background: #fff; color: var(--danger); border: none; border-radius: 50px; padding: 14px 40px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .full-width { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div class="logo">📍</div>
  <h1>위치 알람</h1>
  <div class="status-dot" id="statusDot"></div>
</header>

<div id="mapWrap">
  <div id="map"></div>
  <div class="map-hint">지도를 클릭해서 목적지를 선택하세요</div>
</div>

<div class="section">
  <div class="card">
    <div class="card-title">목적지</div>
    <div id="destDisplay">
      <div class="pin">📌</div>
      <div class="info">
        <div class="addr" id="destAddr">지도에서 목적지를 선택해 주세요</div>
        <div class="coords" id="destCoords"></div>
      </div>
      <button id="clearDest" onclick="clearDestination()">✕</button>
    </div>
  </div>
</div>

<div class="section">
  <div class="card">
    <div class="card-title">알람 설정</div>
    <div class="settings-grid">
      <div class="setting-item full-width">
        <label>알람 반경</label>
        <div class="range-row">
          <input type="range" id="radiusRange" min="100" max="2000" step="50" value="300" oninput="updateRadius(this.value)"/>
          <div class="range-val" id="radiusVal">300m</div>
        </div>
      </div>
      <div class="setting-item">
        <label>이동 수단</label>
        <select id="transportMode">
          <option value="walk">🚶 도보</option>
          <option value="bike">🚲 자전거</option>
          <option value="car" selected>🚗 자동차</option>
          <option value="subway">🚇 지하철</option>
        </select>
      </div>
      <div class="setting-item">
        <label>알람음</label>
        <select id="alarmSound">
          <option value="bell">🔔 벨</option>
          <option value="chime">🎵 차임</option>
          <option value="urgent">🚨 긴급</option>
          <option value="soft">🎶 부드러운</option>
          <option value="beep">📟 비프</option>
        </select>
      </div>
      <div class="setting-item">
        <label>볼륨</label>
        <div class="range-row">
          <input type="range" id="volumeRange" min="0" max="100" step="5" value="80" oninput="updateVolume(this.value)"/>
          <div class="range-val" id="volumeVal">80%</div>
        </div>
      </div>
      <div class="setting-item">
        <label>반복 횟수</label>
        <select id="repeatCount">
          <option value="1">1회</option>
          <option value="3" selected>3회</option>
          <option value="5">5회</option>
          <option value="0">계속</option>
        </select>
      </div>
    </div>
    <button id="testBtn" onclick="playAlarm(true)">▶ 알람음 미리듣기</button>
  </div>
</div>

<div class="section" id="distanceCard">
  <div class="card">
    <div class="card-title">현재 거리</div>
    <div class="dist-display">
      <div class="dist-num" id="distNum">--</div>
      <div class="dist-unit" id="distUnit">목적지까지</div>
      <div class="dist-bar-wrap"><div class="dist-bar" id="distBar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="section">
  <button id="alarmToggle" class="off" onclick="toggleAlarm()">
    <span id="toggleIcon">🔔</span><span id="toggleText">알람 켜기</span>
  </button>
</div>

<div id="alarmOverlay">
  <div class="bell">🔔</div>
  <h2>목적지 근처입니다!</h2>
  <p id="overlayMsg"></p>
  <button id="dismissBtn" onclick="dismissAlarm()">알람 끄기</button>
</div>

<script>
let map, marker, destMarker, watchId, dest=null, isRunning=false, alarmFired=false;
let alarmInterval=null, audioCtx=null, startDist=null;
const speedMap = {walk:5, bike:15, car:40, subway:35};

window.onload = function() {
  navigator.geolocation.getCurrentPosition(pos => {
    const c = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
    map = new kakao.maps.Map(document.getElementById('map'), {center: c, level: 4});
    marker = new kakao.maps.Marker({position: c, map});
    kakao.maps.event.addListener(map, 'click', e => setDestination(e.latLng));
  }, () => {
    const c = new kakao.maps.LatLng(37.5665, 126.9780);
    map = new kakao.maps.Map(document.getElementById('map'), {center: c, level: 5});
    kakao.maps.event.addListener(map, 'click', e => setDestination(e.latLng));
  });
};

function setDestination(latLng) {
  if (destMarker) destMarker.setMap(null);
  destMarker = new kakao.maps.Marker({position: latLng, map});
  const gc = new kakao.maps.services.Geocoder();
  gc.coord2Address(latLng.getLng(), latLng.getLat(), (result, status) => {
    let addr = '위치 선택됨';
    if (status === kakao.maps.services.Status.OK)
      addr = result[0].road_address ? result[0].road_address.address_name : result[0].address.address_name;
    dest = {lat: latLng.getLat(), lng: latLng.getLng(), address: addr};
    document.getElementById('destAddr').textContent = addr;
    document.getElementById('destCoords').textContent = dest.lat.toFixed(5) + ', ' + dest.lng.toFixed(5);
    startDist = null;
  });
}

function clearDestination() {
  dest = null;
  if (destMarker) { destMarker.setMap(null); destMarker = null; }
  document.getElementById('destAddr').textContent = '지도에서 목적지를 선택해 주세요';
  document.getElementById('destCoords').textContent = '';
}

function updateRadius(v) { document.getElementById('radiusVal').textContent = v >= 1000 ? (v/1000).toFixed(1)+'km' : v+'m'; }
function updateVolume(v) { document.getElementById('volumeVal').textContent = v+'%'; }

function toggleAlarm() { if (!isRunning) startAlarm(); else stopAlarm(); }

function startAlarm() {
  if (!dest) { alert('먼저 지도에서 목적지를 선택해 주세요.'); return; }
  isRunning = true; alarmFired = false; startDist = null;
  document.getElementById('alarmToggle').className = 'on';
  document.getElementById('toggleIcon').textContent = '🔕';
  document.getElementById('toggleText').textContent = '알람 끄기';
  document.getElementById('statusDot').classList.add('active');
  document.getElementById('distanceCard').classList.add('visible');
  watchId = navigator.geolocation.watchPosition(onPosition, e => console.warn(e),
    {enableHighAccuracy: true, maximumAge: 5000, timeout: 10000});
}

function stopAlarm() {
  isRunning = false;
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearAlarmSound();
  document.getElementById('alarmToggle').className = 'off';
  document.getElementById('toggleIcon').textContent = '🔔';
  document.getElementById('toggleText').textContent = '알람 켜기';
  document.getElementById('statusDot').classList.remove('active');
  document.getElementById('distanceCard').classList.remove('visible');
}

function onPosition(pos) {
  const {latitude: lat, longitude: lng} = pos.coords;
  if (map && marker) marker.setPosition(new kakao.maps.LatLng(lat, lng));
  if (!dest) return;
  const dist = getDistance(lat, lng, dest.lat, dest.lng) * 1000;
  const radius = parseInt(document.getElementById('radiusRange').value);
  if (!startDist) startDist = Math.max(dist, radius);
  const pct = Math.max(0, Math.min(100, (1 - dist / startDist) * 100));
  const numEl = document.getElementById('distNum'), unitEl = document.getElementById('distUnit');
  if (dist >= 1000) { numEl.textContent = (dist/1000).toFixed(1); unitEl.textContent = 'km 남음'; }
  else { numEl.textContent = Math.round(dist); unitEl.textContent = 'm 남음'; }
  const speed = speedMap[document.getElementById('transportMode').value] * 1000 / 3600;
  const eta = Math.round(dist / speed / 60);
  if (eta > 0) unitEl.textContent += ' (약 ' + eta + '분)';
  document.getElementById('distBar').style.width = pct + '%';
  if (!alarmFired && dist <= radius) { alarmFired = true; fireAlarm(Math.round(dist)); }
}

function getDistance(lat1, lon1, lat2, lon2) {
  const R=6371, r=Math.PI/180, dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
const soundDefs = {
  bell: [{f:880,t:0},{f:1100,t:.15},{f:880,t:.3}],
  chime: [{f:523,t:0},{f:659,t:.2},{f:784,t:.4},{f:1047,t:.6}],
  urgent: [{f:1200,t:0},{f:800,t:.12},{f:1200,t:.24},{f:800,t:.36}],
  soft: [{f:440,t:0},{f:550,t:.3},{f:440,t:.6}],
  beep: [{f:1000,t:0},{f:1000,t:.25}]
};
function playTone(f, st, dur, vol, ctx) {
  const osc=ctx.createOscillator(), g=ctx.createGain();
  osc.connect(g); g.connect(ctx.destination);
  osc.frequency.value=f; osc.type='sine';
  g.gain.setValueAtTime(vol*0.4, st);
  g.gain.exponentialRampToValueAtTime(0.001, st+dur);
  osc.start(st); osc.stop(st+dur);
}
function playAlarmOnce() {
  const ctx=getAudioCtx(), sound=document.getElementById('alarmSound').value;
  const vol=parseInt(document.getElementById('volumeRange').value)/100;
  const notes=soundDefs[sound]||soundDefs.bell, now=ctx.currentTime;
  notes.forEach(n => playTone(n.f, now+n.t, .4, vol, ctx));
  return (notes[notes.length-1].t + .6) * 1000;
}
function playAlarm(testOnly) {
  clearAlarmSound();
  const repeat = testOnly ? 1 : parseInt(document.getElementById('repeatCount').value);
  let count = 0;
  const fire = () => { const dur=playAlarmOnce(); count++; if(repeat===0||count<repeat) alarmInterval=setTimeout(fire, dur+200); };
  fire();
}
function clearAlarmSound() { if (alarmInterval) { clearTimeout(alarmInterval); alarmInterval=null; } }
function fireAlarm(distM) {
  document.getElementById('overlayMsg').textContent = '목적지까지 약 ' + distM + 'm 남았습니다';
  document.getElementById('alarmOverlay').classList.add('show');
  playAlarm(false);
  if (Notification.permission === 'granted') new Notification('📍 위치 알람', {body: '목적지까지 약 '+distM+'m 남았습니다!'});
  else if (Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p==='granted') new Notification('📍 위치 알람', {body: '목적지까지 약 '+distM+'m 남았습니다!'}); });
}
function dismissAlarm() { document.getElementById('alarmOverlay').classList.remove('show'); clearAlarmSound(); stopAlarm(); }
if (typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
